[package]
name = "pnuke"
version = "0.1.1"
edition = "2024"
authors = ["Almost Ordinary <hello@almostordinary.dev>", "Parth Gorde <parth@almostordinary.dev>"]
description = "⚡ The sub-millisecond port killer and listener cockpit for developers."
license = "MIT OR Apache-2.0"
repository = "https://github.com/almostordinary/pnuke"
readme = "README.md"
keywords = ["cli", "port", "kill", "tui", "network"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
clap_complete = "4.6.12"
colored = "3.1.1"
crossterm = "0.29.0"
libc = "0.2.191"
listeners = "0.6.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(not(unix))'.dependencies]
sysinfo = "0.40.4"
