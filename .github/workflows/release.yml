name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_name: pnuke-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
            build_deb: true
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_name: pnuke-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
            build_deb: false
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_name: pnuke-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz
            build_deb: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: pnuke-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip
            build_deb: false

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Unix Archive (.tar.gz)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.archive_name }} pnuke
          cd ../../..
          shasum -a 256 ${{ matrix.archive_name }} > ${{ matrix.archive_name }}.sha256

      - name: Package Windows Archive (.zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/pnuke.exe -DestinationPath ${{ matrix.archive_name }}
          (Get-FileHash ${{ matrix.archive_name }} -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.archive_name }}" | Out-File -FilePath "${{ matrix.archive_name }}.sha256" -Encoding ascii

      - name: Build Debian Package (.deb)
        if: matrix.build_deb
        run: |
          cargo install cargo-deb
          cargo deb --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/debian/*.deb .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256
            *.deb

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download All Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Combined Checksums
        run: |
          cd artifacts
          cat *.sha256 > checksums.txt || true
          cd ..

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
